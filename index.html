<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 확대를 막지 않는다. 학습 앱에서 글자 키우기는 접근성의 기본이다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="IT 단어를 그림으로 보고, 읽고, 퀴즈로 확인하는 모바일 학습 앱">
  <meta name="color-scheme" content="light dark">
  <title>IT 단어 학습</title>

  <!-- 홈 화면에 추가하면 독립 앱으로 뜬다.
       theme-color 를 밝기별로 나눠 둬야 상태표시줄이 배경과 이어진다.
       apple-touch-icon 은 iOS 가 manifest 대신 이걸 본다.

       두 값은 css/tokens.css 의 --paper 와 반드시 같아야 한다. 종이색이
       따뜻한 쪽에서 차가운 쪽으로 옮겨 갔는데(#fbfaf8 -> #f5f7f8,
       #141310 -> #12171a) 여기만 옛 값으로 남아, 홈 화면에 설치한 앱의
       상태표시줄과 본문 사이에 색 띠가 하나 생겨 있었다. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f5f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12171a" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IT 단어">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- 폰트는 저장소에서 받는다(css/tokens.css 의 @font-face). CDN 을 타면
       지하철에서 글꼴만 시스템 폰트로 바뀌어 같은 앱이 달라 보인다.
       본문용 Pretendard 는 첫 화면에 바로 쓰이므로 미리 받아둔다. -->
  <link rel="preload" href="fonts/pretendard-subset.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <div id="view"></div>
    <nav id="tabbar" class="tabbar" aria-label="주요 화면"></nav>
  </div>

  <!-- 데이터는 tools/build.py 가 저장소 안의 content/*.md 에서 굽는다.
       여기서 읽는 것은 이름과 한 줄 뜻뿐이다. 본문은 단어를 펼칠 때
       data/terms/<권>.js 를 그때 받는다 (js/store.js 의 loadBody). -->
  <script src="data/index.js"></script>

  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
  <!-- 그림 어휘(배우 아이콘 · 장면 컷 만화). screens.js 가 화면을 세울 때
       Art.scene 을 부르므로 그 앞에 온다. -->
  <script src="js/art.js"></script>
  <script src="js/screens.js"></script>
  <!-- 읽기 화면의 장치들(용어 풀이 · 그림 단계 보기 · 배우 아이콘 부착).
       screens.js 가 화면을 세운 다음에 DOM 을 손보므로 반드시 그 뒤에 온다.
       없어도 앱은 읽힌다. -->
  <script src="js/reading.js"></script>
  <script src="js/recall.js"></script>
  <script src="js/quiz-screens.js"></script>
  <script>
    window.App.start();

    /* 오프라인 준비. file:// 로 열면 navigator.serviceWorker 가 없거나 등록이
       막히므로 조용히 건너뛴다 — 앱 자체는 그래도 그대로 돌아간다. */
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {
          /* 등록에 실패해도 앱은 온라인으로 계속 쓸 수 있다. 사용자에게
             알릴 것이 없다 — 고칠 방법이 없는 경고는 소음일 뿐이다. */
        });
      });
    }
  </script>
</body>
</html>
